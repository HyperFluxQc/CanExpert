name: Python acceptance tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # one failing job does not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest      # where CAN Expert is used, with Kvaser, Vector and IXXAT adapters
            python-version: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONFAULTHANDLER: "1"       # a crash prints the Python stack it died in
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - name: Run the tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: python tools/ci_annotations.py test-output.txt

  build:
    name: Windows programs
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: CanExpert-windows
          path: dist/CanExpert-*-windows.zip
